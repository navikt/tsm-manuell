apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: tsm-manuell
  namespace: tsm
  labels:
    team: tsm

spec:
  port: 3000
  liveness:
    path: /api/internal/is_alive
  readiness:
    path: /api/internal/is_ready
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs

  azure:
    application:
      enabled: true
    sidecar:
      enabled: true
      autoLogin: true

  accessPolicy:
    outbound:
      rules:
        - application: syfosmmanuell-backend
          namespace: teamsykmelding
        - application: modiacontextholder
          namespace: personoversikt
