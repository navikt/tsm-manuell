name: Build & Deploy
on: push

env:
  APP: tsm-manuell

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test-and-verify:
    name: Test & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/yarn@main
        with:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: yarn fmt:check
      - run: yarn next typegen
      - run: yarn lint
      - run: yarn tsc
      - run: yarn test

  build-dev:
    name: Build for dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/next/build@main
        id: next-build
        with:
          app: ${{ env.APP }}
          env: dev
          team: 'tsm'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          server-actions-encryption-key: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
    outputs:
      image: ${{ steps.next-build.outputs.image }}

  build-demo:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'demo')
    name: Build for demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/next/build@main
        id: next-build
        with:
          app: ${{ env.APP }}
          env: demo
          team: 'tsm'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          server-actions-encryption-key: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
    outputs:
      image: ${{ steps.next-build.outputs.image }}

  build-prod:
    name: Build for prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/next/build@main
        id: next-build
        with:
          app: ${{ env.APP }}
          env: prod
          team: 'tsm'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          server-actions-encryption-key: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
    outputs:
      image: ${{ steps.next-build.outputs.image }}

  deploy-dev:
    name: Deploy main to dev
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'dev/')
    environment:
      name: dev
      url: https://syfosmmanuell.intern.dev.nav.no
    runs-on: ubuntu-latest
    needs: [build-dev, test-and-verify]
    steps:
      - uses: actions/checkout@v7
      - uses: nais/setup@v1
        with:
          team: tsm
          environment: dev-gcp
      - name: deploy to dev-gcp
        run: nais apply .nais/app.yaml --set spec.image="${{ needs.build-dev.outputs.image }}" --wait

  deploy-demo:
    if: github.ref_name == 'main'
    name: Deploy main to demo
    environment:
      name: demo-main
      url: https://${{ env.APP }}.ekstern.dev.nav.no
    runs-on: ubuntu-latest
    needs: [build-demo, test-and-verify]
    steps:
      - uses: actions/checkout@v7
      - uses: nais/setup@v1
        with:
          team: tsm
          environment: dev-gcp
      - name: deploy demo to dev-gcp
        run: nais apply .nais/app.demo.yaml --set spec.image="${{ needs.build-demo.outputs.image }}" --wait

  deploy-production:
    name: Deploy main to production
    if: github.ref_name == 'main'
    environment:
      name: production
      url: https://syfosmmanuell.intern.nav.no
    runs-on: ubuntu-latest
    needs: [deploy-dev, build-prod]
    steps:
      - uses: actions/checkout@v7
      - uses: nais/setup@v1
        with:
          team: tsm
          environment: prod-gcp
      - name: deploy to prod-gcp
        run: nais apply .nais/app.yaml --set spec.image="${{ needs.build-prod.outputs.image }}" --wait

  security:
    name: Security
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      security-events: write
    needs: build-prod
    uses: navikt/tsm-workflows/.github/workflows/security.yaml@main
    with:
      image: ${{ needs.build-prod.outputs.image }}
      team: 'tsm'
